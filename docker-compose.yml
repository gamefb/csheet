services:
  migrations:
    profiles:
      - app
    build:
      context: .
      target: runtime
    image: csheet-app:local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: csheet_user
      POSTGRES_PASSWORD: csheet_pass
      POSTGRES_DB: csheet_dev
    command: ["/usr/local/bin/run-migrations.sh", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  minio-init:
    profiles:
      - app
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 csheet_minio csheet_minio_pass &&
        mc mb --ignore-existing myminio/csheet-uploads &&
        echo 'Bucket ready.'
      "

  app:
    profiles:
      - app
    build:
      context: .
      target: runtime
    image: csheet-app:local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: csheet_user
      POSTGRES_PASSWORD: csheet_pass
      POSTGRES_DB: csheet_dev
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: csheet_minio
      S3_SECRET_ACCESS_KEY: csheet_minio_pass
      S3_BUCKET_NAME: csheet-uploads
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-in-production}
    ports:
      - "3000:3000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: csheet_postgres
    environment:
      POSTGRES_DB: csheet_dev
      POSTGRES_USER: csheet_user
      POSTGRES_PASSWORD: csheet_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csheet_user -d csheet_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: csheet_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: csheet_minio
      MINIO_ROOT_PASSWORD: csheet_minio_pass
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
